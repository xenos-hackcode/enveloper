<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Seven Little Secrets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fff5f8;
    --blush:#f1d9e5;
    --pink:#e9a9c0;
    --pink-dark:#c85f83;
    --ink:#55384b;
    --muted:#93667c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;min-height:100svh;
    background:linear-gradient(135deg,var(--cream),var(--blush));
    font-family:'Cormorant Garamond',Georgia,serif;
    color:var(--ink);
  }
  body{
    display:flex;justify-content:center;align-items:center;
    padding:24px 16px;
    min-height:100svh;
  }
  .container{
    width:100%;max-width:480px;text-align:center;
  }
  h1{
    font-family:'Great Vibes',cursive;
    font-weight:400;
    font-size:clamp(2.2rem,9vw,3rem);
    margin:0 0 6px;
    color:var(--pink-dark);
  }
  .subtitle{
    color:var(--muted);
    margin:0 0 28px;
    font-size:clamp(13px,3.6vw,15px);
    letter-spacing:.3px;
  }
  .stage{
    height:clamp(230px,56vw,320px);
    display:flex;justify-content:center;align-items:center;
    perspective:1000px;
    touch-action:manipulation;
  }
  .envelope{
    width:min(340px,86vw);
    height:min(220px,56vw);
    position:relative;
    cursor:pointer;
    transform-style:preserve-3d;
    transform:scale(var(--scale,1));
    transition:transform .45s ease;
  }
  .envelope:hover{transform:scale(var(--scale,1)) translateY(-4px)}
  .back{position:absolute;inset:0;background:var(--pink);border-radius:10px}
  .letter{
    position:absolute;z-index:2;
    left:8%;bottom:10%;width:84%;height:78%;
    background:#fffaf1;border:1px solid #eadfce;border-radius:6px;
    display:flex;justify-content:center;align-items:center;
    padding:12px;
    font-size:clamp(1.3rem,5vw,1.8rem);
    font-style:italic;color:var(--pink-dark);
    box-shadow:0 2px 8px #00000012;
    transform:translateY(0) scale(.93);
    transition:transform .55s ease;
    text-align:center;line-height:1.3;
  }
  .front{
    position:absolute;z-index:3;inset:0;
    background:linear-gradient(145deg,#f4cbd8,#e9a9c0);
    clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);
    border-radius:10px;
  }
  .flap{
    position:absolute;z-index:4;top:0;left:0;width:100%;height:58%;
    background:#f8d9e3;
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top;
    transition:transform .45s ease;
  }
  .seal{
    position:absolute;z-index:5;top:48%;left:50%;
    transform:translate(-50%,-50%);
    width:38px;height:38px;
    display:flex;justify-content:center;align-items:center;
    border-radius:50%;background:var(--pink-dark);color:#fff;
    font-family:Arial,sans-serif;font-size:19px;
    transition:opacity .25s;
  }
  .envelope.open .flap{transform:rotateX(180deg);z-index:1}
  .envelope.open .seal{opacity:0}
  .envelope.open .letter{transform:translateY(-48%) scale(1)}

  .counter{
    margin-top:18px;color:var(--muted);
    font-family:Arial,sans-serif;font-weight:bold;font-size:13px;letter-spacing:.5px;
  }
  .progress{display:flex;justify-content:center;gap:8px;margin-top:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:#dfc1cf;transition:background .2s}
  .dot.active{background:var(--pink-dark)}

  button{
    margin:22px 6px 0;
    padding:12px 22px;
    border:1px solid #d7a1b7;border-radius:30px;
    background:#fff8fb;color:var(--ink);
    cursor:pointer;font-size:14px;font-family:Arial,sans-serif;
    touch-action:manipulation;
  }
  button:hover,button:active{background:#fff}

  .hint{margin-top:16px;color:var(--muted);font-family:Arial,sans-serif;font-size:13px}

  /* ---- finale (after the 7th envelope) ---- */
  .finale{display:none;flex-direction:column;align-items:center;gap:18px}
  .finale.show{display:flex}
  .finale .note{
    width:min(86vw,320px);
    background:#fffaf1;border-radius:8px;
    box-shadow:0 14px 34px #00000022;
    padding:38px 24px;
  }
  .finale .note p{
    margin:0;font-family:'Great Vibes',cursive;
    font-size:clamp(2.4rem,11vw,3.4rem);
    color:var(--pink-dark);line-height:1.1;
  }
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
  .hearts span{
    position:absolute;bottom:-10%;font-size:18px;color:var(--pink-dark);opacity:0;
    animation:rise 3.2s ease-in forwards;
  }
  @keyframes rise{
    0%{opacity:0;transform:translateY(0) rotate(0deg)}
    10%{opacity:.9}
    100%{opacity:0;transform:translateY(-110vh) rotate(25deg)}
  }

  @media (max-width:400px){
    h1{font-size:1.9rem}
    .stage{height:230px}
    .envelope{height:150px}
  }
</style>
</head>
<body>

<div class="container">
  <div id="sequence">
    <h1>Seven Little Secrets</h1>
    <p class="subtitle">Every envelope holds a little surprise.</p>

    <div class="stage">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open envelope">
        <div class="back"></div>
        <div class="letter" id="letter">one more secret inside&hellip;</div>
        <div class="front"></div>
        <div class="flap"></div>
        <div class="seal">&#9825;</div>
      </div>
    </div>

    <div class="counter" id="counter">Envelope 1 of 7</div>
    <div class="progress" id="progress"></div>
    <p class="hint" id="hint">Tap the envelope to open it.</p>
    <button id="restart">Start again</button>
  </div>

  <div class="finale" id="finale">
    <div class="note"><p>I love you.</p></div>
    <button id="restart2">Open again</button>
  </div>
</div>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<script>
  const envelope = document.getElementById('envelope');
  const letter = document.getElementById('letter');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const hint = document.getElementById('hint');
  const restart = document.getElementById('restart');
  const restart2 = document.getElementById('restart2');
  const sequence = document.getElementById('sequence');
  const finale = document.getElementById('finale');
  const heartsBox = document.getElementById('hearts');

  const totalEnvelopes = 7;
  let currentEnvelope = 1;
  let isOpen = false;

  for (let i = 1; i <= totalEnvelopes; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 1 ? ' active' : '');
    progress.appendChild(dot);
  }

  function updateDisplay() {
    envelope.classList.toggle('open', isOpen);
    const scale = Math.max(0.45, 1 - (currentEnvelope - 1) * 0.09);
    envelope.style.setProperty('--scale', scale);
    letter.textContent = currentEnvelope === totalEnvelopes ? 'I love you…' : 'one more secret inside…';
    counter.textContent = `Envelope ${currentEnvelope} of ${totalEnvelopes}`;

    [...progress.children].forEach((dot, index) => {
      dot.classList.toggle('active', index < currentEnvelope);
    });

    hint.textContent = isOpen
      ? (currentEnvelope === totalEnvelopes
          ? 'Tap once more for your last little secret.'
          : 'Tap again to discover the next envelope.')
      : 'Tap the envelope to open it.';
  }

  function spawnHearts() {
    for (let i = 0; i < 24; i++) {
      const s = document.createElement('span');
      s.textContent = '♥';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = (Math.random() * 1.2) + 's';
      s.style.fontSize = (14 + Math.random() * 16) + 'px';
      heartsBox.appendChild(s);
    }
    setTimeout(() => { heartsBox.innerHTML = ''; }, 4500);
  }

  function showFinale() {
    sequence.style.display = 'none';
    finale.classList.add('show');
    spawnHearts();
  }

  function handleEnvelopeClick() {
    if (!isOpen) {
      isOpen = true;
      updateDisplay();
      if (currentEnvelope === totalEnvelopes) {
        setTimeout(showFinale, 750);
      }
      return;
    }
    if (currentEnvelope < totalEnvelopes) {
      currentEnvelope++;
      isOpen = false;
      updateDisplay();
    }
  }

  envelope.addEventListener('click', handleEnvelopeClick);
  envelope.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      handleEnvelopeClick();
    }
  });

  function resetAll() {
    currentEnvelope = 1;
    isOpen = false;
    sequence.style.display = '';
    finale.classList.remove('show');
    heartsBox.innerHTML = '';
    updateDisplay();
  }

  restart.addEventListener('click', resetAll);
  restart2.addEventListener('click', resetAll);

  updateDisplay();
</script>

</body>
</html>
